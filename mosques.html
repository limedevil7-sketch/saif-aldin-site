<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>أقرب 7 مساجد</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{
box-sizing:border-box
}

body{
margin:0;
background:#f8f9ff;
font-family:Arial,sans-serif;
color:#222;
}

header{
background:#003527;
color:white;
padding:20px;
text-align:center;
}

#map{
width:100%;
height:45vh;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.card{
background:white;
border-radius:18px;
padding:15px;
margin-bottom:15px;
box-shadow:0 5px 20px #0002;
}

.status{
text-align:center;
}

.mosque{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
}

.name{
font-size:18px;
font-weight:bold;
color:#003527;
}

.btn{
background:#064e3b;
color:white;
padding:10px 15px;
border-radius:12px;
text-decoration:none;
border:none;
cursor:pointer;
}

.error{
color:red;
}

.leaflet-popup-content{
direction:rtl;
text-align:right;
}

@media(max-width:600px){

.mosque{
flex-direction:column;
align-items:flex-start;
}

}
</style>

</head>

<body>


<header>

<h1>🕌 أقرب مسجد</h1>

<p>أقرب 7 مساجد إلى موقعك</p>

</header>


<div id="map"></div>


<div class="container">


<div id="status" class="card status">
جاري تحديد موقعك...
</div>


<button class="btn" onclick="getLocation()">
🔄 تحديث الموقع
</button>


<h2>
أقرب 7 مساجد
</h2>


<div id="list"></div>


</div>



<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

let map;


const statusBox =
document.getElementById("status");

const list =
document.getElementById("list");



function calcDistance(lat1,lon1,lat2,lon2){

let R=6371;

let dLat=(lat2-lat1)*Math.PI/180;

let dLon=(lon2-lon1)*Math.PI/180;


let a =
Math.sin(dLat/2)**2 +
Math.cos(lat1*Math.PI/180) *
Math.cos(lat2*Math.PI/180) *
Math.sin(dLon/2)**2;


return R*2*Math.atan2(
Math.sqrt(a),
Math.sqrt(1-a)
);

}



function getLocation(){


if(!navigator.geolocation){

statusBox.innerHTML=
"المتصفح لا يدعم الموقع";

return;

}



navigator.geolocation.getCurrentPosition(

pos=>{

let lat =
pos.coords.latitude;

let lon =
pos.coords.longitude;


loadMap(lat,lon);

searchMosques(lat,lon);


},


()=>{

statusBox.innerHTML=
"يرجى السماح باستخدام الموقع";

statusBox.className=
"card status error";

},

{

enableHighAccuracy:true,
timeout:10000

}


);


}




function loadMap(lat,lon){


if(map)
map.remove();


map=L.map("map")
.setView([lat,lon],15);



L.tileLayer(

"https://tile.openstreetmap.org/{z}/{x}/{y}.png",

{

maxZoom:19,
attribution:"© OpenStreetMap"

}

).addTo(map);



L.marker([lat,lon])

.addTo(map)

.bindPopup("📍 موقعك الحالي")

.openPopup();


}





async function searchMosques(lat,lon){


statusBox.innerHTML=
"جاري البحث عن المساجد...";



let radius=10000;



let query=

`

[out:json];

(

node["amenity"="place_of_worship"]["religion"="muslim"](around:${radius},${lat},${lon});

way["amenity"="place_of_worship"]["religion"="muslim"](around:${radius},${lat},${lon});

);

out center tags;

`;



try{


let response =
await fetch(

"https://overpass-api.de/api/interpreter",

{

method:"POST",

body:query

}

);



let data =
await response.json();



let mosques =
data.elements.map(m=>{


let mlat =
m.lat || m.center?.lat;


let mlon =
m.lon || m.center?.lon;



return {

name:
m.tags?.name ||
m.tags?.["name:ar"] ||
"مسجد قريب",

lat:mlat,

lon:mlon,

distance:
calcDistance(
lat,
lon,
mlat,
mlon
)

};


})
.filter(x=>x.lat);



mosques.sort(
(a,b)=>
a.distance-b.distance
);



mosques =
mosques.slice(0,7);



showMosques(mosques);



}

catch(e){


statusBox.innerHTML=
"حدث خطأ أثناء البحث";

statusBox.className=
"card status error";


}


}





function showMosques(mosques){


list.innerHTML="";


statusBox.innerHTML=
"تم العثور على "
+
mosques.length
+
" مساجد";



mosques.forEach((m,i)=>{


let distance =
m.distance < 1 ?

Math.round(m.distance*1000)+" متر"

:

m.distance.toFixed(1)+" كم";



list.innerHTML +=

`

<div class="card mosque">

<div>

<div class="name">

🕌 ${i+1}. ${m.name}

</div>

<div>

📍 ${distance}

</div>

</div>


<a class="btn"

target="_blank"

href="https://www.google.com/maps/dir/?api=1&destination=${m.lat},${m.lon}">

الاتجاهات

</a>


</div>

`;



L.marker([m.lat,m.lon])

.addTo(map)

.bindPopup(

"<b>🕌 "+m.name+
"</b><br>"+distance

);


});


}



getLocation();


</script>


</body>
</html>
