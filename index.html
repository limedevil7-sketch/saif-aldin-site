<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق مواقيت الصلاة والأهداف</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            text-align: center;
            padding: 20px;
        }
        #app {
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        button {
            margin: 5px;
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            background: #007bff;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
        .countdown {
            font-size: 24px;
            font-weight: bold;
            margin: 15px 0;
        }
    </style>
</head>
<body>

<!-- محتوى التطبيق -->
<div id="app">
    <div id="prayerLocation">جاري التحميل...</div>
    <div id="todayDate">--/--/----</div>
    
    <div id="currentPrayerName">--</div>
    <div id="currentPrayerTime">--:--</div>
    <div id="nextPrayerText">--</div>

    <div class="countdown">
        <span id="countdownHours">--</span>:<span id="countdownMinutes">--</span>:<span id="countdownSeconds">--</span>
    </div>

    <div>
        <button id="locationButton">تحديث الموقع</button>
        <button id="shareVerseButton">مشاركة آية</button>
        <button id="downloadAppButton">تحميل التطبيق</button>
    </div>
</div>

<script>
(function() {
    /* =====================================================
       CONFIG & STATE
    ===================================================== */
    const CONFIG = {
        apiBase: "https://api.aladhan.com/v1/timingsByCity",
        calculationMethod: 5,
        school: 0,
        storageKeys: {
            location: "app_user_location"
        },
        defaultLocation: {
            latitude: 30.0444,
            longitude: 31.2357,
            name: "القاهرة"
        }
    };

    const state = {
        location: null,
        today: null,
        tomorrow: null,
        isLoading: false,
        countdownTimer: null,
        refreshTimer: null
    };

    const prayerNames = {
        Fajr: "الفجر",
        Dhuhr: "الظهر",
        Asr: "العصر",
        Maghrib: "المغرب",
        Isha: "العشاء"
    };

    const mainPrayerKeys = ["Fajr", "Dhuhr", "Asr", "Maghrib", "Isha"];

    function $(id) {
        return document.getElementById(id);
    }

    const prayerLocation = $("prayerLocation");
    const todayDate = $("todayDate");
    const currentPrayerName = $("currentPrayerName");
    const currentPrayerTime = $("currentPrayerTime");
    const nextPrayerText = $("nextPrayerText");
    const countdownHours = $("countdownHours");
    const countdownMinutes = $("countdownMinutes");
    const countdownSeconds = $("countdownSeconds");

    function formatApiDate(date) {
        const d = new Date(date);
        const day = String(d.getDate()).padStart(2, '0');
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const year = d.getFullYear();
        return `${day}-${month}-${year}`;
    }

    function getLocalDateKey() {
        return formatApiDate(new Date());
    }

    function writeStorage(key, value) {
        try {
            localStorage.setItem(key, JSON.stringify(value));
        } catch (e) {
            console.error(e);
        }
    }

    function readStorage(key, defaultValue) {
        try {
            const item = localStorage.getItem(key);
            return item ? JSON.parse(item) : defaultValue;
        } catch (e) {
            return defaultValue;
        }
    }

    function formatArabicDate(date) {
        return new Intl.DateTimeFormat("ar-EG", {
            weekday: "long",
            year: "numeric",
            month: "long",
            day: "numeric"
        }).format(date);
    }

    function normalizeGoals() {}
    function renderGoals() {}
    function renderProfile() {}

    /* =====================================================
       LOCATION SYSTEM
    ===================================================== */
    function saveLocation(location) {
        writeStorage(CONFIG.storageKeys.location, location);
    }

    function getSavedLocation() {
        return readStorage(CONFIG.storageKeys.location, null);
    }

    function setLocation(location) {
        state.location = location;
        saveLocation(location);
        if (prayerLocation) {
            prayerLocation.textContent = location.name;
        }
    }

    async function reverseGeocode(latitude, longitude) {
        try {
            const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${encodeURIComponent(latitude)}&lon=${encodeURIComponent(longitude)}&accept-language=ar`;
            const response = await fetch(url, {
                headers: { "Accept": "application/json" }
            });
            if (!response.ok) return null;
            const data = await response.json();
            return data.display_name || null;
        } catch {
            return null;
        }
    }

    function requestLocation() {
        return new Promise((resolve, reject) => {
            if (!navigator.geolocation) {
                reject(new Error("المتصفح لا يدعم تحديد الموقع"));
                return;
            }
            navigator.geolocation.getCurrentPosition(resolve, reject, {
                enableHighAccuracy: true,
                timeout: 15000,
                maximumAge: 5 * 60 * 1000
            });
        });
    }

    /* =====================================================
       PRAYER API
    ===================================================== */
    async function getPrayerTimes(latitude, longitude, date) {
        const url = new URL(`https://api.aladhan.com/v1/timings/${formatApiDate(date)}`);
        url.searchParams.set("latitude", latitude);
        url.searchParams.set("longitude", longitude);
        url.searchParams.set("method", CONFIG.calculationMethod);
        url.searchParams.set("school", CONFIG.school);

        const response = await fetch(url.toString(), {
            method: "GET",
            headers: { "Accept": "application/json" },
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error(`Prayer API HTTP ${response.status}`);
        }

        const result = await response.json();
        if (result.code !== 200 || !result.data || !result.data.timings) {
            throw new Error(result.status || "بيانات المواقيت غير متاحة");
        }

        return {
            timings: result.data.timings,
            meta: result.data.meta || null
        };
    }

    function cleanPrayerTime(value) {
        if (!value) return null;
        const match = String(value).match(/^(\d{1,2}):(\d{2})/);
        if (!match) return null;
        const hours = Number(match[1]);
        const minutes = Number(match[2]);
        if (hours < 0 || hours > 23 || minutes < 0 || minutes > 59) return null;
        return { hours, minutes };
    }

    function prayerTimeToDate(time, baseDate) {
        const parsed = cleanPrayerTime(time);
        if (!parsed) return null;
        const date = new Date(baseDate);
        date.setHours(parsed.hours, parsed.minutes, 0, 0);
        return date;
    }

    function formatArabicTime(time) {
        const parsed = cleanPrayerTime(time);
        if (!parsed) return "--:--";
        const date = new Date();
        date.setHours(parsed.hours, parsed.minutes, 0, 0);
        return new Intl.DateTimeFormat("ar-EG", {
            hour: "numeric",
            minute: "2-digit",
            hour12: true
        }).format(date);
    }

    function getPrayerList(timings) {
        return mainPrayerKeys.map(key => ({
            key,
            name: prayerNames[key],
            time: timings[key]
        })).filter(prayer => cleanPrayerTime(prayer.time));
    }

    async function loadPrayerTimes() {
        if (!state.location || state.isLoading) return;
        state.isLoading = true;

        try {
            const now = new Date();
            const tomorrow = new Date(now);
            tomorrow.setDate(tomorrow.getDate() + 1);

            const [todayResult, tomorrowResult] = await Promise.all([
                getPrayerTimes(state.location.latitude, state.location.longitude, now),
                getPrayerTimes(state.location.latitude, state.location.longitude, tomorrow)
            ]);

            state.today = {
                date: new Date(now),
                timings: todayResult.timings,
                meta: todayResult.meta
            };

            state.tomorrow = {
                date: new Date(tomorrow),
                timings: tomorrowResult.timings,
                meta: tomorrowResult.meta
            };

            if (todayDate) {
                todayDate.textContent = formatArabicDate(now);
            }

            updatePrayerDisplay();
        } catch (error) {
            console.error("Prayer loading error:", error);
            if (currentPrayerName) currentPrayerName.textContent = "تعذر تحميل المواقيت";
            if (currentPrayerTime) currentPrayerTime.textContent = "--:--";
            if (nextPrayerText) nextPrayerText.textContent = "تأكد من اتصال الإنترنت وحاول مرة أخرى";
            if (countdownHours) countdownHours.textContent = "--";
            if (countdownMinutes) countdownMinutes.textContent = "--";
            if (countdownSeconds) countdownSeconds.textContent = "--";
        } finally {
            state.isLoading = false;
        }
    }

    function updatePrayerDisplay() {
        if (!state.today || !state.tomorrow) return;

        const now = new Date();
        const todayPrayers = getPrayerList(state.today.timings);
        const tomorrowPrayers = getPrayerList(state.tomorrow.timings);

        let currentPrayer = null;
        let nextPrayer = null;
        let nextPrayerDate = null;

        for (const prayer of todayPrayers) {
            const prayerDate = prayerTimeToDate(prayer.time, now);
            if (!prayerDate) continue;
            if (prayerDate > now) {
                nextPrayer = prayer;
                nextPrayerDate = prayerDate;
                break;
            }
            currentPrayer = prayer;
        }

        // التصحيح الجذري هنا: إذا انتهت صلاة العشاء وفات وقتها (يعني دخلنا الليل بعد العشاء)
        const ishaPrayer = todayPrayers.find(p => p.key === "Isha");
        const ishaDate = ishaPrayer ? prayerTimeToDate(ishaPrayer.time, now) : null;

        if (!nextPrayer || (ishaDate && now >= ishaDate)) {
            const tomorrowDate = new Date(state.tomorrow.date);
            const fajr = tomorrowPrayers.find(prayer => prayer.key === "Fajr");
            if (fajr) {
                nextPrayer = fajr;
                nextPrayerDate = prayerTimeToDate(fajr.time, tomorrowDate);
            }
            // بما أن العشاء انقضت وقتها، نثبت أن الصلاة الحالية هي العشاء التي انقضى وقتها اليوم
            currentPrayer = ishaPrayer || todayPrayers[todayPrayers.length - 1];
        }

        if (!nextPrayerDate) return;

        if (currentPrayerName) currentPrayerName.textContent = currentPrayer.name;
        if (currentPrayerTime) currentPrayerTime.textContent = formatArabicTime(currentPrayer.time);
        if (nextPrayerText) nextPrayerText.textContent = `${nextPrayer.name} • ${formatArabicTime(nextPrayer.time)}`;

        startCountdown(nextPrayerDate);
    }

    function startCountdown(targetDate) {
        if (state.countdownTimer) {
            clearInterval(state.countdownTimer);
        }

        function tick() {
            const now = new Date();
            let difference = targetDate.getTime() - now.getTime();

            if (difference <= 0) {
                clearInterval(state.countdownTimer);
                loadPrayerTimes();
                return;
            }

            const totalSeconds = Math.floor(difference / 1000);
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;

            if (countdownHours) countdownHours.textContent = String(hours).padStart(2, "0");
            if (countdownMinutes) countdownMinutes.textContent = String(minutes).padStart(2, "0");
            if (countdownSeconds) countdownSeconds.textContent = String(seconds).padStart(2, "0");
        }

        tick();
        state.countdownTimer = setInterval(tick, 1000);
    }

    /* =====================================================
       LOCATION START & HANDLERS
    ===================================================== */
    async function startLocationSystem() {
        if (prayerLocation) prayerLocation.textContent = "جاري تحديد موقعك...";

        try {
            const position = await requestLocation();
            const latitude = Number(position.coords.latitude);
            const longitude = Number(position.coords.longitude);

            if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) {
                throw new Error("إحداثيات الموقع غير صالحة");
            }

            let name = "مواقيت الصلاة حسب موقعك";
            const place = await reverseGeocode(latitude, longitude);
            if (place) name = place;

            setLocation({ latitude, longitude, name });
            await loadPrayerTimes();
        } catch (error) {
            console.warn("Location unavailable:", error);
            const savedLocation = getSavedLocation();

            if (
                savedLocation &&
                Number.isFinite(Number(savedLocation.latitude)) &&
                Number.isFinite(Number(savedLocation.longitude))
            ) {
                setLocation({
                    latitude: Number(savedLocation.latitude),
                    longitude: Number(savedLocation.longitude),
                    name: savedLocation.name || "الموقع المحفوظ"
                });
            } else {
                setLocation(CONFIG.defaultLocation);
            }
            await loadPrayerTimes();
        }
    }

    let lastDateKey = getLocalDateKey();

    function checkDateChange() {
        const currentKey = getLocalDateKey();
        if (currentKey !== lastDateKey) {
            lastDateKey = currentKey;
            normalizeGoals();
            renderGoals();
            loadPrayerTimes();
        }
    }

    state.refreshTimer = setInterval(checkDateChange, 30000);

    $("locationButton")?.addEventListener("click", async () => {
        if (prayerLocation) prayerLocation.textContent = "جاري تحديث الموقع...";

        try {
            const position = await requestLocation();
            const latitude = Number(position.coords.latitude);
            const longitude = Number(position.coords.longitude);

            let name = "مواقيت الصلاة حسب موقعك";
            const place = await reverseGeocode(latitude, longitude);
            if (place) name = place;

            setLocation({ latitude, longitude, name });
            await loadPrayerTimes();
        } catch (error) {
            console.warn(error);
            if (state.location && state.location.name) {
                prayerLocation.textContent = state.location.name;
            } else {
                prayerLocation.textContent = "تعذر تحديد الموقع";
            }
        }
    });

    /* =====================================================
       SHARE & DOWNLOAD
    ===================================================== */
    $("shareVerseButton")?.addEventListener("click", async () => {
        const text = "إِنَّ مَعَ الْعُسْرِ يُسْرًا — سورة الشرح (94:6)";
        try {
            if (navigator.share) {
                await navigator.share({ title: "آية اليوم", text });
            } else if (navigator.clipboard) {
                await navigator.clipboard.writeText(text);
                alert("تم نسخ الآية");
            }
        } catch {}
    });

    $("downloadAppButton")?.addEventListener("click", () => {
        alert("أضف هنا رابط App Store أو Google Play الخاص بتطبيقك.");
    });

    /* =====================================================
       INITIALIZE
    ===================================================== */
    renderProfile();
    normalizeGoals();
    renderGoals();
    startLocationSystem();

    setInterval(() => {
        loadPrayerTimes();
    }, 6 * 60 * 60 * 1000);

    document.addEventListener("visibilitychange", () => {
        if (!document.hidden) {
            checkDateChange();
            updatePrayerDisplay();
        }
    });

})();
</script>

</body>
</html>
